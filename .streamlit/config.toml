[theme]
primaryColor = "#ff6b6b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[server]
maxUploadSize = 200
enableCORS = false
enableXsrfProtection = false
runOnSave = true
pythonVersion = "3.11" 

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
